<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoC personmaskering</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<h1>PoC personmaskering</h1>

<section id="runtime" class="panel">
  <h2>Runtime</h2>
  <dl>
    <dt>ort-version</dt><dd id="ort-version">–</dd>
    <dt>Provider</dt><dd id="provider">–</dd>
    <dt>Init</dt><dd id="init-ms">–</dd>
    <dt>In/ut</dt><dd id="io-names">–</dd>
    <dt>Läge</dt><dd id="display-mode">–</dd>
  </dl>
  <button id="init">Ladda modell</button>
  <button id="selftest">Självtest</button>
</section>

<section class="panel">
  <h2>Bild</h2>
  <button id="start-cam">Starta kamera</button>
  <button id="shoot" disabled>Ta foto och maskera</button>
  <input type="file" id="file" accept="image/*">
  <video id="video" playsinline muted></video>
</section>

<section class="panel">
  <h2>Inställningar</h2>
  <label>Tröskel <input type="range" id="threshold" min="0.05" max="0.5" step="0.01" value="0.12"><output id="threshold-out">0.12</output></label>
  <label>Utvidgning <input type="range" id="expand" min="0" max="0.4" step="0.01" value="0.18"><output id="expand-out">0.18</output></label>
  <label>Max regionstorlek <input type="range" id="maxandel" min="0.05" max="1" step="0.05" value="1"><output id="maxandel-out">av</output></label>
  <label><input type="checkbox" id="tiling" checked> Tiling (helbild + 2×2 + 3×3)</label>
</section>

<section class="panel" id="t9">
  <h2>T9 — startlogg</h2>
  <p id="t9-rad"></p>
  <p id="t9-sammanfattning"></p>
  <p>Frågade kameran om lov vid den här starten?
    <button id="kam-ja">Ja</button>
    <button id="kam-nej">Nej</button>
  </p>
  <button id="t9-export">Exportera logg (JSON)</button>
</section>

<section class="panel">
  <h2>Resultat</h2>
  <p id="status">Väntar.</p>
  <p id="metrics"></p>
  <p id="regioner"></p>
  <p id="geo"></p>
  <button id="download" hidden>Ladda ner maskad bild</button>
  <canvas id="preview"></canvas>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
